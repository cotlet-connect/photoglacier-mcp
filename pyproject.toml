[project]
name = "photoglacier-mcp"
version = "1.1.0"
description = "Connect Photoglacier to ChatGPT, Claude, Codex and Claude Code and any AI agent through Cotlet.dev, a hosted MCP server. No Photoglacier API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["photoglacier", "photoglacier api", "photoglacier mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/photoglacier-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=photoglacier"
Source = "https://github.com/cotlet-connect/photoglacier-mcp"

[project.scripts]
photoglacier-mcp = "photoglacier_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"photoglacier_agent.py" = "photoglacier_agent.py"

[tool.hatch.build.targets.sdist]
include = ["photoglacier_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
